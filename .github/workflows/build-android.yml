name: Build Kurt Dhylan Moto Shop Inventory V3 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted

          ZIP="$(find . -maxdepth 3 -type f -name '*Source*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP not found."
            exit 1
          fi

          echo "Extracting: $ZIP"
          unzip -q -o "$ZIP" -d extracted

          echo "Project files:"
          find extracted -type f | sort

      - name: Locate MAUI project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(find extracted -type f -name '*.csproj' -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .csproj file found."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found: $PROJECT"

      - name: Install MAUI Android
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Build APK
        run: >
          dotnet publish "$PROJECT"
          -f net10.0-android
          -c Release
          --no-restore
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          APK="$(find extracted -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" artifacts/KurtDhylanMotoShopInventoryV3.apk
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KurtDhylanMotoShopInventoryV3-APK
          path: artifacts/KurtDhylanMotoShopInventoryV3.apk
          
